<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日检车辆智能分配工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f2f5;--card:#fff;--primary:#1677ff;--primary-dark:#0958d9;
  --a:#1677ff;--b:#722ed1;--c:#13c2c2;--d:#fa8c16;
  --text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 顶部标题栏 */
.header{background:linear-gradient(135deg,#1677ff 0%,#722ed1 100%);color:#fff;padding:20px 16px 24px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.header::before{content:'';position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.header h1{font-size:20px;font-weight:700;margin-bottom:4px;position:relative;z-index:1}
.header p{font-size:12px;opacity:.85;position:relative;z-index:1}
.steps{display:flex;gap:8px;margin:16px 16px 0;position:relative;z-index:1}
.step{flex:1;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);border-radius:8px;padding:8px;text-align:center;font-size:11px;border:1px solid rgba(255,255,255,.3)}
.step.active{background:rgba(255,255,255,.35);border-color:#fff}
.step .num{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:rgba(255,255,255,.3);font-weight:bold;margin-right:2px}

.container{max-width:1000px;margin:0 auto;padding:12px}

/* 统计卡片 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat .label{font-size:12px;color:var(--sub);margin-bottom:6px}
.stat .val{font-size:22px;font-weight:700}
.stat.total .val{color:var(--primary)}
.stat.a .val{color:var(--a)}
.stat.b .val{color:var(--b)}
.stat.c .val{color:var(--c)}
.stat.d .val{color:var(--d)}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--primary)}

/* 上传区 */
.upload-area{border:2px dashed #d9d9d9;border-radius:10px;padding:28px 16px;text-align:center;transition:.2s;cursor:pointer;background:#fafafa}
.upload-area:hover{border-color:var(--primary);background:#f0f5ff}
.upload-area .icon{font-size:36px;margin-bottom:8px}
.upload-area .tip{font-size:13px;color:var(--sub)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 2px 6px rgba(22,119,255,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(22,119,255,.4)}
.btn-primary:disabled{background:#bfbfbf;box-shadow:none;cursor:not-allowed;transform:none}
.btn-default{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:linear-gradient(135deg,#52c41a,#389e0d);color:#fff}
.btn-gray{background:#f0f0f0;color:var(--text)}

/* 状态 */
.status{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;background:#f0f5ff;color:var(--primary)}
.status.err{background:#fff2f0;color:#ff4d4f}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px;border-radius:8px;overflow:hidden}
thead th{background:#fafafa;font-weight:600;padding:10px 6px;border-bottom:2px solid var(--line);color:var(--sub);text-align:center}
tbody td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
tbody tr:hover{background:#fafbff}
input.cell,select{padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;width:100%;background:#fff}
input.cell:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.15)}
.row-del{color:#ff4d4f;cursor:pointer;font-size:13px;padding:4px 8px;border-radius:4px}
.row-del:hover{background:#fff1f0}

/* 类型标签 */
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.tag-a{background:#fff1f0;color:#cf1322}
.tag-b{background:#fff7e6;color:#d46b08}
.tag-c{background:#fffbe6;color:#d48806}
.tag-8{background:#e6fffb;color:#08979c}
.tag-z{background:#f6ffed;color:#389e0d}

/* 分配结果卡片 */
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.group-card{border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.group-head{padding:12px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.group-head .name{font-weight:600;font-size:15px}
.group-head .score{font-size:13px;opacity:.95}
.group-body{padding:10px;background:#fff}
.group-body table{font-size:12px}
.group-body td{padding:5px 4px}
.ga .group-head{background:linear-gradient(135deg,#1677ff,#4096ff)}
.gb .group-head{background:linear-gradient(135deg,#722ed1,#9254de)}
.gc .group-head{background:linear-gradient(135deg,#13c2c2,#36cfc9)}
.gd .group-head{background:linear-gradient(135deg,#fa8c16,#ffa940)}

/* 平衡状态 */
.balance{margin-top:14px;padding:14px;border-radius:10px;text-align:center;font-size:14px;font-weight:500}
.balance.ok{background:linear-gradient(135deg,#f6ffed,#d9f7be);color:#389e0d;border:1px solid #b7eb8f}
.balance.warn{background:linear-gradient(135deg,#fff2f0,#ffccc7);color:#cf1322;border:1px solid #ffa39e}

/* 空状态 */
.empty{text-align:center;padding:20px;color:#bfbfbf;font-size:13px}

/* 进度条 */
.bar{height:6px;background:#f0f0f0;border-radius:3px;margin-top:6px;overflow:hidden}
.bar-inner{height:100%;border-radius:3px;transition:width .5s}
</style>
</head>
<body>

<div class="header">
  <h1>🚇 日检车辆智能分配工具</h1>
  <p>批量识别车载屏照片，自动按分值均衡分配到各作业段</p>
  <div class="steps">
    <div class="step active"><span class="num">1</span>上传图片</div>
    <div class="step"><span class="num">2</span>核对数据</div>
    <div class="step"><span class="num">3</span>一键分配</div>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="card-title">上传日检表图片</div>
    <label class="upload-area" for="fileInput">
      <div class="icon">📷</div>
      <div><strong>点击选择图片</strong>（可多选）</div>
      <div class="tip">支持DCC下发的日检车股道表截图</div>
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div class="btn-row">
      <button class="btn btn-gray" id="addRowBtn">+ 手动添加车辆</button>
    </div>
    <div class="status" id="status">正在加载识别模型，请稍候…</div>
  </div>

  <div class="card" id="tableCard" style="display:none">
    <div class="card-title">识别结果核对</div>
    <div class="stats" id="miniStats"></div>
    <div style="overflow-x:auto">
    <table id="dataTable">
      <thead><tr><th>股道</th><th>车号</th><th>日检类型</th><th>分值</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
    <div class="btn-row" style="justify-content:flex-end">
      <button class="btn btn-success" id="assignBtn">⚡ 一键自动分配</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="card-title">分配结果</div>
    <div class="result-grid" id="resultGrid"></div>
    <div class="balance" id="balanceBox"></div>
    <div class="btn-row" style="justify-content:center;margin-top:14px">
      <button class="btn btn-primary" id="copyBtn">📋 复制分配结果</button>
    </div>
  </div>

</div>

<script type="importmap">
{"imports":{"ppocrv5":"./lib/ppocrv5@0.5.0/dist/index.js"}}
</script>
<script type="module">
import { createPPOcrV5 } from 'ppocrv5';

const SCORES={'日检A':4,'日检B':2,'日检C':1,'八日检':0.5,'自检':0.5};
const TYPE_KEYS=Object.keys(SCORES);
let ocr=null,ocrReady=false;

async function initOcr(){
  try{
    ocr=createPPOcrV5({
      baseUrl:"./models",modelVariant:"mobile",
      detectionModelPath:"det_mobile.onnx",recognitionModelPath:"rec_mobile.onnx",
      dictionaryUrl:"./models/ppocrv5_dict.txt",
      wasmPaths:"./wasm/",cacheModels:true,providerPreference:"wasm",wasmThreads:1,
    });
    await ocr.init();ocrReady=true;
    setStatus('✅ 模型加载完成，可选择图片识别');
  }catch(e){setStatus('❌ 模型加载失败：'+e.message,true);}
}
initOcr();

function setStatus(msg,isErr){const el=document.getElementById('status');el.textContent=msg;el.className='status'+(isErr?' err':'');}
function setStep(n){document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('active',i<=n-1));}

function matchType(t){
  t=t.replace(/\s/g,'');
  if(/八/.test(t)&&/日/.test(t))return'八日检';
  if(/自/.test(t)&&/检/.test(t))return'自检';
  if(/日[检檢]?\s*A/.test(t)||/日\s*A/.test(t))return'日检A';
  if(/日[检檢]?\s*B/.test(t)||/日\s*B/.test(t))return'日检B';
  if(/日[检檢]?\s*C/.test(t)||/日\s*C/.test(t))return'日检C';
  if(/里程/.test(t))return'里程修';
  return null;
}
function matchCarNo(t){const m=t.match(/01(\d{2})/);if(m){const n=parseInt(m[1]);if(n>=1&&n<=67)return'01'+m[1];}return null;}
function matchTrack(t){const m=t.match(/(\d{1,2})\s*([ABC])/);if(m)return(m[1].padStart(2,'0'))+m[2];return null;}

function bboxY(line){const ys=line.bbox.map(p=>p[1]??p.y);return Math.min(...ys);}
function bboxX(line){const xs=line.bbox.map(p=>p[0]??p.x);return(Math.min(...xs)+Math.max(...xs))/2;}

function parseTable(lines,imgW,imgH){
  const colW=imgW/3;
  const cols=[[],[],[]];
  for(const line of lines){
    const cx=bboxX(line);
    const ci=Math.min(2,Math.max(0,Math.floor(cx/colW)));
    cols[ci].push(line);
  }
  const cars=[];
  for(let c=0;c<3;c++){
    const col=cols[c].slice().sort((a,b)=>bboxY(a)-bboxY(b));
    const rowH=Math.max(22,imgH/16*0.55);
    const rows=[];
    for(const line of col){
      const y=bboxY(line);let placed=false;
      for(const row of rows){if(Math.abs(row.y-y)<rowH){row.lines.push(line);placed=true;break;}}
      if(!placed)rows.push({y,lines:[line]});
    }
    for(const row of rows){
      let track=null,carNo=null,type=null;
      for(const l of row.lines){
        const txt=l.text||'';
        if(!track)track=matchTrack(txt);
        if(!carNo)carNo=matchCarNo(txt);
        if(!type)type=matchType(txt);
      }
      if(type&&type!=='里程修'&&carNo){
        cars.push({track:track||carNo+(c===0?'A':c===1?'B':'C'),carNo,type,score:SCORES[type]||0,col:c});
      }
    }
  }
  return cars;
}

function loadImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file);});}

document.getElementById('fileInput').addEventListener('change',async(e)=>{
  const files=[...e.target.files];if(!files.length)return;
  if(!ocrReady){alert('模型还在加载，请稍候');return;}
  const allCars=[];
  for(let i=0;i<files.length;i++){
    setStatus(`⏳ 识别中 ${i+1}/${files.length}：${files[i].name}`);
    const img=await loadImage(files[i]);
    const result=await ocr.recognize(img);
    const lines=result.lines||result.words||[];
    const cars=parseTable(lines,img.width,img.height);
    allCars.push(...cars);
  }
  setStatus(`✅ 识别完成，共 ${allCars.length} 辆，请核对后点"一键自动分配"`);
  setStep(2);
  renderTable(allCars);
});

function tagClass(t){return t==='日检A'?'tag-a':t==='日检B'?'tag-b':t==='日检C'?'tag-c':t==='八日检'?'tag-8':'tag-z';}

function renderTable(cars){
  const tbody=document.querySelector('#dataTable tbody');tbody.innerHTML='';
  cars.forEach((car)=>addRow(car));
  document.getElementById('tableCard').style.display='block';
  updateMiniStats();
}

function addRow(car={track:'',carNo:'',type:'八日检'}){
  const tbody=document.querySelector('#dataTable tbody');
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><input class="cell" data-f="track" value="${car.track||''}"></td>
    <td><input class="cell" data-f="carNo" value="${car.carNo||''}"></td>
    <td><select data-f="type">
      ${TYPE_KEYS.map(k=>`<option value="${k}" ${k===car.type?'selected':''}>${k}</option>`).join('')}
      <option value="里程修" ${car.type==='里程修'?'selected':''}>里程修(不参与)</option>
    </select></td>
    <td><span class="tag ${tagClass(car.type)}">${SCORES[car.type]||0}</span></td>
    <td><span class="row-del">删除</span></td>`;
  tbody.appendChild(tr);
  tr.querySelector('[data-f=type]').addEventListener('change',e=>{
    const v=e.target.value;const tag=tr.querySelector('.tag');tag.textContent=v==='里程修'?0:(SCORES[v]||0);tag.className='tag '+tagClass(v);updateMiniStats();
  });
  tr.querySelector('.row-del').addEventListener('click',()=>{tr.remove();updateMiniStats();});
  tr.querySelectorAll('input.cell').forEach(i=>i.addEventListener('input',updateMiniStats));
}

document.getElementById('addRowBtn').addEventListener('click',()=>{addRow();document.getElementById('tableCard').style.display='block';updateMiniStats();});

function getColFromTrack(t){if(t.endsWith('A'))return 0;if(t.endsWith('B'))return 1;if(t.endsWith('C'))return 2;return 0;}

function updateMiniStats(){
  const cars=getCarsFromTable();
  const total=cars.reduce((s,c)=>s+c.score,0);
  const byType={};cars.forEach(c=>byType[c.type]=(byType[c.type]||0)+1);
  let html=`<div class="stat total"><div class="label">车辆总数</div><div class="val">${cars.length}</div></div>`;
  html+=`<div class="stat"><div class="label">总分值</div><div class="val" style="color:var(--primary)">${total.toFixed(1)}</div></div>`;
  for(const t of TYPE_KEYS){html+=`<div class="stat"><div class="label">${t}</div><div class="val" style="font-size:18px">${byType[t]||0}</div></div>`;}
  document.getElementById('miniStats').innerHTML=html;
}

function getCarsFromTable(){
  const cars=[];
  document.querySelectorAll('#dataTable tbody tr').forEach(tr=>{
    const track=tr.querySelector('[data-f=track]').value.trim();
    const carNo=tr.querySelector('[data-f=carNo]').value.trim();
    const type=tr.querySelector('[data-f=type]').value;
    if(type&&type!=='里程修'&&carNo)cars.push({track,carNo,type,score:SCORES[type]||0,col:getColFromTrack(track)});
  });
  return cars;
}

function assignCars(cars){
  const segA=cars.filter(c=>c.col===0);
  const segB=cars.filter(c=>c.col===1);
  const segC=cars.filter(c=>c.col===2);
  const segASimple=segA.filter(c=>['八日检','日检C','自检'].includes(c.type));
  const segAHard=segA.filter(c=>['日检A','日检B'].includes(c.type));
  const keyOf=c=>c.carNo+'#'+c.track;

  const gA=[];let sA=0;
  segASimple.sort((a,b)=>a.score-b.score);
  for(const c of segASimple){if(sA+c.score<=4.5){gA.push(c);sA+=c.score;}}
  if(sA<3){for(const c of segAHard){if(c.type==='日检B'&&sA+c.score<=4.5){gA.push(c);sA+=c.score;if(sA>=3)break;}}}
  if(sA<3){for(const c of segAHard){if(c.type==='日检A'&&sA+c.score<=5){gA.push(c);sA+=c.score;break;}}}

  const used=new Set(gA.map(keyOf));
  const remainA=segA.filter(c=>!used.has(keyOf(c)));

  const pool=[...remainA,...segB].sort((a,b)=>b.score-a.score);
  const gS=[];let sS=0;
  for(const c of pool){if(sS+c.score<=5.5){gS.push(c);sS+=c.score;}if(sS>=4)break;}
  if(sS<4){for(const c of pool){if(!gS.includes(c)){gS.push(c);sS+=c.score;break;}}}
  const usedS=new Set(gS.map(keyOf));

  const remain=cars.filter(c=>!used.has(keyOf(c))&&!usedS.has(keyOf(c)));
  let gB=remain.filter(c=>c.col===1);
  let gC=remain.filter(c=>c.col===2);
  gB.push(...remain.filter(c=>c.col===0));

  let sB=gB.reduce((s,c)=>s+c.score,0);
  let sC=gC.reduce((s,c)=>s+c.score,0);

  for(let iter=0;iter<30&&Math.abs(sB-sC)>1;iter++){
    if(sB>sC){
      const cand=gB.filter(c=>c.col!==0).sort((a,b)=>a.score-b.score);let moved=false;
      for(const c of cand){if(Math.abs((sB-c.score)-(sC+c.score))<Math.abs(sB-sC)){gB=gB.filter(x=>x!==c);gC.push(c);sB-=c.score;sC+=c.score;moved=true;break;}}
      if(!moved)break;
    }else{
      const cand=gC.filter(c=>c.col!==2).sort((a,b)=>a.score-b.score);let moved=false;
      for(const c of cand){if(Math.abs((sC-c.score)-(sB+c.score))<Math.abs(sB-sC)){gC=gC.filter(x=>x!==c);gB.push(c);sC-=c.score;sB+=c.score;moved=true;break;}}
      if(!moved)break;
    }
  }
  return{groupA:{cars:gA,score:sA},station:{cars:gS,score:sS},groupB:{cars:gB,score:sB},groupC:{cars:gC,score:sC}};
}

document.getElementById('assignBtn').addEventListener('click',()=>{
  const cars=getCarsFromTable();
  if(!cars.length){alert('请先识别或添加车辆');return;}
  setStep(3);
  const r=assignCars(cars);
  renderResult(r);
});

function renderResult(r){
  const groups=[
    {cls:'ga',name:'段A',sub:'2人作业',data:r.groupA,target:'目标 3-4 分'},
    {cls:'gb',name:'驻站+搭档',sub:'2人作业',data:r.station,target:'目标 4-5 分'},
    {cls:'gc',name:'段B',sub:'2人作业',data:r.groupB,target:'与段C均衡'},
    {cls:'gd',name:'段C',sub:'2人作业',data:r.groupC,target:'与段B均衡'}
  ];
  let html='';
  for(const g of groups){
    const maxScore=Math.max(r.groupA.score,r.station.score,r.groupB.score,r.groupC.score,1);
    const pct=Math.round(g.data.score/maxScore*100);
    html+=`<div class="group-card ${g.cls}">
      <div class="group-head">
        <div><div class="name">${g.name}</div><div style="font-size:11px;opacity:.8">${g.sub}</div></div>
        <div class="score">${g.data.score.toFixed(1)} 分<br><span style="font-size:11px">${g.data.cars.length}辆 · ${g.target}</span></div>
      </div>
      <div class="group-body">
        <table><tbody>`;
    if(g.data.cars.length){
      for(const c of g.data.cars)html+=`<tr><td>${c.track}</td><td><strong>${c.carNo}</strong></td><td><span class="tag ${tagClass(c.type)}">${c.type}</span></td><td>${c.score}</td></tr>`;
    }else{
      html+=`<tr><td colspan="4" style="color:#bfbfbf;padding:12px">无</td></tr>`;
    }
    html+=`</tbody></table><div class="bar"><div class="bar-inner" style="width:${pct}%;background:${g.cls==='ga'?'var(--a)':g.cls==='gb'?'var(--b)':g.cls==='gc'?'var(--c)':'var(--d)'}"></div></div></div></div>`;
  }
  document.getElementById('resultGrid').innerHTML=html;
  const diff=Math.abs(r.groupB.score-r.groupC.score);
  const box=document.getElementById('balanceBox');
  box.className='balance '+(diff<=1?'ok':'warn');
  box.innerHTML=diff<=1
    ?`✅ 段B <strong>${r.groupB.score.toFixed(1)}</strong> 分 vs 段C <strong>${r.groupC.score.toFixed(1)}</strong> 分，差值 <strong>${diff.toFixed(1)}</strong> 分，符合均衡要求`
    :`⚠️ 段B <strong>${r.groupB.score.toFixed(1)}</strong> 分 vs 段C <strong>${r.groupC.score.toFixed(1)}</strong> 分，差值 <strong>${diff.toFixed(1)}</strong> 分，超出1分`;
  document.getElementById('resultCard').style.display='block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}

document.getElementById('copyBtn').addEventListener('click',()=>{
  let txt='';
  document.querySelectorAll('.group-card').forEach(g=>{
    const name=g.querySelector('.name').textContent;
    const score=g.querySelector('.score').childNodes[0].textContent.trim();
    txt+=`\n【${name}】${score}\n`;
    g.querySelectorAll('tbody tr').forEach(tr=>{
      const cells=[...tr.children].map(c=>c.textContent.trim());
      if(cells.length>=4&&cells[0]!=='无')txt+=`  ${cells[0]} ${cells[1]} ${cells[2]}(${cells[3]}分)\n`;
    });
  });
  navigator.clipboard.writeText(txt.trim()).then(()=>alert('✅ 已复制到剪贴板')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('✅ 已复制');
  });
});
</script>
</body>
</html>
